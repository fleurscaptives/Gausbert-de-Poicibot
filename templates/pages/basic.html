<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/content.html"
        }
    }
    ---
    <!-- Basic template for a page with a single document -->
    <link rel="stylesheet" href="resources/css/gausbert.css"/>
    <script src="resources/scripts/gausbert.js"/>
<pb-page endpoint="https://teipublisher.com/exist/apps/tei-publisher" api-version="1.0.0" subscribe="facsimile">
  <div class="pagina">
    <div class="banner">
       <img src="resources/images/banner[[ replace($context?doc?path, 'canso|\.xml', '') ]].png" alt="Banner della canzone"/>
    </div>

    <div class="layout">
    
    [% template before %]
 <div id="interagisci">
            <h3>Scopri</h3>
            <button id="btn_diff">⊶ Loci divergenti</button>
            <button id="btn_loci">𖦹 Loci direttivi</button>
            <button id="btn_glos">🕮 Glossario </button>
</div>
            <pb-collapse>
        <div slot="collapse-trigger" class="collapse">Stemma</div>
            <div slot="collapse-content" class="stemma-content">
               <img src="resources/images/stemma[[ replace($context?doc?path, 'canso|\.xml', '') ]].svg" alt="Stemma della tradizione"/>
            </div>
    </pb-collapse>
    <div id="simboli">
            <h3>Simboli pop-up</h3>
              <pb-popover theme="light">
                 <span id="gen_pop">⁕</span>
                 <template slot="alternate">
                                <span class="sym" id="info_gen">Approfondimenti dal glossario, note paleografiche dagli apparati e ulteriori informazioni generali.</span>
                 </template>
              </pb-popover>
              <pb-popover theme="light">
                 <span id="con_pop">〰</span>
                 <template slot="alternate">
                                <span class="sym" id="info_con">Indicazione negli apparati di avvenuta contaminazione fra due rami della tradizione.</span>
                 </template>
              </pb-popover>
              </div>
[% endtemplate %]


        <main class="contenuto">
        
            <section class="manoscritti">
                <h3>Manoscritti</h3>
                <pb-view src="document1" load-css="resources/css/gausbert.css" xpath="//tei:div[@type='manoscritti']"/>
            </section>
            
[% if exists($context?doc?content//tei:div[@type='trad_ind']) %]
<section id="trad_ind">

    <pb-view src="document1" load-css="resources/css/gausbert.css" xpath="//tei:div[@type='trad_ind']">
    </pb-view>
    <br/>
    <label id="check_extra">
    <input type="checkbox" id="xtra">
    Mostra nel testo</input>
    </label>
  
</section>
[% endif %]
            

            <section class="metrica">
               <pb-view src="document1" load-css="resources/css/gausbert.css" xpath="//tei:div[@type='scheda_metrica']"/>
            </section>


            <section class="testi">

                <div class="colonne">
                    <div>
                       <pb-view id="txt_critico" src="document1" load-css="resources/css/gausbert.css" xpath="//tei:div[@type='txt_critico']"/>
                    </div>
                    <div>
                        <pb-view id="txt_cst" src="document1" load-css="resources/css/txt_cst.css" xpath="//tei:div[@type='txt_costellazione']"/>
                    </div>
                    
                  <div id="extra_container">
                    <pb-view src="document1" load-css="resources/css/gausbert.css" xpath="//div[@type='trad_extra']"/>
                  </div>
                </div>
            </section>
                <br/>

            <div>
                <pb-view src="document1" load-css="resources/css/gausbert.css" xpath="//tei:div[@type='biblio']"/>
            </div>

        </main>
    </div>
  </div>
  
[% template after %]
  <div class="side">
    <pb-collapse>

        <div slot="collapse-trigger" class="collapse">
            <h3>Traduzione</h3>
        </div>

        <pb-view slot="collapse-content" load-css="resources/css/gausbert.css" src="document1" xpath="//tei:div[@type='trad_critico']" id="traduzione">
        </pb-view>

    </pb-collapse>
  </div>
  
    <div class="side">
    <pb-collapse>

        <div slot="collapse-trigger" class="collapse">
            <h3>Apparato critico</h3>
        </div>
        <pb-view slot="collapse-content" id="app_crt" src="document1" load-css="resources/css/gausbert.css" xpath="//tei:div[@type='app_crt_sos']">
        </pb-view>
        <pb-view slot="collapse-content" id="app_crt_f" src="document1" load-css="resources/css/gausbert.css" xpath="//tei:div[@type='app_crt_form']">
        </pb-view>

    </pb-collapse>
  </div>
  
  <div class="side">
    <pb-collapse>

        <div slot="collapse-trigger" class="collapse">
            <h3>Apparato di costellazione</h3>
        </div>
        <pb-view slot="collapse-content" src="document1" load-css="resources/css/gausbert.css" xpath="//tei:div[@type='app_cos_sos']" id="app_cst">
        </pb-view>
        <pb-view slot="collapse-content" src="document1" load-css="resources/css/gausbert.css" xpath="//tei:div[@type='app_cos_form']" id="app_cst_f">
        </pb-view>

    </pb-collapse>
    <br/>
    <button id="apri_mss">Facsimili</button>
    
    <div id="mss-panel">
<pb-view src="document1" id="view-facsimili" load-css="resources/css/gausbert.css" xpath="//tei:facsimile" subscribe="facsimile"/>

        <pb-facsimile type="image" base-uri="http://localhost:8080/exist/apps/GausbPcb/" facsimiles="[&#34;images/no_facs.png&#34;]" default-zoom-level="0" show-navigation-control="true" show-sequence-control="true" subscribe="facsimile" show-full-page-control="true"/>
        
    </div>
 </div>
[% endtemplate %]

</pb-page>
</template>
